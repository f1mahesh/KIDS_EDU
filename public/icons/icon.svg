<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <!-- 3D Isometric Cube -->
  <polygon points="256,88 400,168 256,248 112,168" fill="#fde047" />
  <polygon points="112,168 256,248 256,416 112,336" fill="#10b981" />
  <polygon points="400,168 256,248 256,416 400,336" fill="#0ea5e9" />
  <!-- Math symbols on cube faces -->
  <text x="256" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="66" fill="#1e293b">×</text>
  <text x="184" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="72" fill="#ffffff">+</text>
  <text x="328" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="72" fill="#ffffff">−</text>
</svg>
